<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Вход в админку — KAVKAZ-CAR</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('icons/favicon-32.png') }}">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body data-authenticated="0">
  <div class="container" style="max-width:380px; padding-top:80px;">
    {% if has_logo_image %}<p style="text-align:center;margin-bottom:12px;"><img src="{{ static_url('img/logo.png') }}" alt="KAVKAZ-CAR" width="140" height="140" style="border-radius:20px;"></p>{% endif %}
    <h1 style="font-size:20px;margin-bottom:24px;text-align:center;">KAVKAZ-CAR Admin</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      {% if needs_secret %}
        <div class="field"><label for="secret">Секретный код</label><input id="secret" name="secret" type="password" autocomplete="off" required></div>
      {% endif %}
      <div class="field"><label for="code">Код из приложения <span class="text-muted">(если включён)</span></label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
  </div>
  <script src="{{ static_url('js/app.js') }}" defer></script>
</body>
</html>
