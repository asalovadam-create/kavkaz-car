{% extends "admin/_base.html" %}
{% block admin_content %}
  <table class="data-table">
    <thead><tr><th>Автомобиль</th><th>Причина</th><th>Комментарий</th><th>Действия</th></tr></thead>
    <tbody>
      {% for report in reports %}
        <tr>
          <td>{% if report.car %}<a href="{{ car_detail_url(report.car) }}" target="_blank">{{ report.car.title() }}</a>{% else %}удалён{% endif %}</td>
          <td>{{ report.reason }}</td>
          <td>{{ report.message or '—' }}</td>
          <td>
            <form method="post" action="{{ url_for('admin_panel.resolve_report', report_id=report.id) }}" class="row">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" name="action" value="hide" class="btn btn-ghost btn-sm">Скрыть</button>
              <button type="submit" name="action" value="block" class="btn btn-danger btn-sm">Заблокировать</button>
              <button type="submit" name="action" value="restore" class="btn btn-ghost btn-sm">Восстановить</button>
              <button type="submit" name="action" value="dismiss" class="btn btn-ghost btn-sm">Отклонить</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
