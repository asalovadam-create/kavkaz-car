{% extends "admin/_base.html" %}
{% block admin_content %}
  <table class="data-table">
    <thead><tr><th>Автомобиль</th><th>Владелец</th><th>Город</th><th>Статус</th><th>Действия</th></tr></thead>
    <tbody>
      {% for car in cars %}
        <tr>
          <td><a href="{{ car_detail_url(car) }}" target="_blank">{{ car.title() }}</a></td>
          <td>{{ car.owner.phone }}</td>
          <td>{{ car.city.name }}</td>
          <td><span class="status-dot status-{{ car.status }}">{{ car.status }}</span></td>
          <td>
            <form method="post" action="{{ url_for('admin_panel.set_car_status', car_id=car.id) }}" class="row" style="flex-wrap:wrap;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <select name="status" style="background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:6px;">
                {% for s in ['published','paused','blocked','pending','draft','expired'] %}
                  <option value="{{ s }}" {{ 'selected' if car.status == s }}>{{ s }}</option>
                {% endfor %}
              </select>
              <button type="submit" class="btn btn-ghost btn-sm">Сохранить</button>
            </form>
            <form method="post" action="{{ url_for('admin_panel.delete_car', car_id=car.id) }}"
                  onsubmit="return confirm('Удалить это объявление навсегда? Отменить нельзя.');" style="margin-top:6px;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-danger btn-sm">Удалить навсегда</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
